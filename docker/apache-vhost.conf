<VirtualHost *:8443>
    ServerName localhost
    ServerAdmin admin@localhost

    SSLEngine on
    SSLCertificateFile      /writable/etc/apache/tls.crt
    SSLCertificateKeyFile   /writable/etc/apache/tls.key
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5
    SSLHonorCipherOrder on

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    ProxyPreserveHost On
    ProxyRequests Off

    <Location />
        Require all granted
    </Location>
    <Location /wss>
        Require all granted
    </Location>

    # wstunnel backend listens at the root on 127.0.0.1:30000.
    # /wss is the explicit tunnel path; / is proxied too as a fallback.
    ProxyPass        /wss/  ws://127.0.0.1:30000/
    ProxyPassReverse /wss/  ws://127.0.0.1:30000/
    ProxyPass        /wss   ws://127.0.0.1:30000/
    ProxyPassReverse /wss   ws://127.0.0.1:30000/

    ProxyPass        /      ws://127.0.0.1:30000/
    ProxyPassReverse /      ws://127.0.0.1:30000/

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
