apiVersion: v1
kind: Service
metadata:
  name: kubepivot
  labels:
    app: kubepivot
spec:
  type: NodePort
  selector:
    app: kubepivot
  ports:
    # Only the HTTPS entry point is published to the outside world.
    # SSH travels *inside* this TLS/WebSocket channel (that is the whole point).
    - name: https
      port: 8443
      targetPort: 8443
      nodePort: 30443
      protocol: TCP

    # --- OPTIONAL: expose raw SSH directly (LAN / debugging only) ------------
    # Uncomment to reach sshd without the tunnel. NOT recommended on the
    # public internet: it adds attack surface and defeats the encapsulation.
    # - name: ssh
    #   port: 2222
    #   targetPort: 2222
    #   nodePort: 30222
    #   protocol: TCP
